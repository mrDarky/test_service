{% extends "base.html" %}

{% block title %}Admin - Settings - Test Service{% endblock %}

{% block content %}
<h2 class="mb-4">System Settings</h2>

<nav class="nav nav-pills mb-4">
    <a class="nav-link" href="/admin">Dashboard</a>
    <a class="nav-link" href="/admin/users">Users</a>
    <a class="nav-link" href="/admin/projects">Projects</a>
    <a class="nav-link" href="/admin/tasks">Tasks</a>
    <a class="nav-link" href="/admin/ip-logs">IP Logs</a>
    <a class="nav-link active" href="/admin/settings">Settings</a>
</nav>

<button class="btn btn-primary mb-3" data-bs-toggle="modal" data-bs-target="#newSettingModal">
    <i class="bi bi-plus-circle"></i> Add Setting
</button>

<div class="table-responsive">
    <table class="table table-striped">
        <thead>
            <tr>
                <th>Key</th>
                <th>Value</th>
                <th>Description</th>
                <th>Updated</th>
            </tr>
        </thead>
        <tbody id="settingsTable">
            <!-- Settings will be loaded here -->
        </tbody>
    </table>
</div>

<!-- New Setting Modal -->
<div class="modal fade" id="newSettingModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Add New Setting</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="newSettingForm">
                    <div class="mb-3">
                        <label for="settingKey" class="form-label">Key</label>
                        <input type="text" class="form-control" id="settingKey" required>
                    </div>
                    <div class="mb-3">
                        <label for="settingValue" class="form-label">Value</label>
                        <input type="text" class="form-control" id="settingValue" required>
                    </div>
                    <div class="mb-3">
                        <label for="settingDescription" class="form-label">Description</label>
                        <textarea class="form-control" id="settingDescription" rows="2"></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" onclick="createSetting()">Add</button>
            </div>
        </div>
    </div>
</div>

<script>
async function loadSettings() {
    const token = localStorage.getItem('token');
    if (!token) {
        window.location.href = '/login';
        return;
    }
    
    try {
        const response = await fetch('/api/admin/settings', {
            headers: {
                'Authorization': `Bearer ${token}`
            }
        });
        
        if (response.ok) {
            const settings = await response.json();
            displaySettings(settings);
        } else {
            showAlert('Failed to load settings', 'danger');
        }
    } catch (error) {
        showAlert('An error occurred', 'danger');
    }
}

function displaySettings(settings) {
    const tbody = document.getElementById('settingsTable');
    
    if (settings.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" class="text-center">No settings found</td></tr>';
        return;
    }
    
    tbody.innerHTML = settings.map(setting => `
        <tr>
            <td><strong>${escapeHtml(setting.key)}</strong></td>
            <td>${escapeHtml(setting.value)}</td>
            <td>${escapeHtml(setting.description || 'N/A')}</td>
            <td>${new Date(setting.updated_at).toLocaleDateString()}</td>
        </tr>
    `).join('');
}

async function createSetting() {
    const token = localStorage.getItem('token');
    const key = document.getElementById('settingKey').value;
    const value = document.getElementById('settingValue').value;
    const description = document.getElementById('settingDescription').value;
    
    try {
        const response = await fetch('/api/admin/settings', {
            method: 'POST',
            headers: {
                'Authorization': `Bearer ${token}`,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ key, value, description })
        });
        
        if (response.ok) {
            showAlert('Setting added successfully', 'success');
            bootstrap.Modal.getInstance(document.getElementById('newSettingModal')).hide();
            document.getElementById('newSettingForm').reset();
            loadSettings();
        } else {
            const data = await response.json();
            showAlert(data.detail || 'Failed to add setting', 'danger');
        }
    } catch (error) {
        showAlert('An error occurred', 'danger');
    }
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

document.addEventListener('DOMContentLoaded', loadSettings);
</script>
{% endblock %}
