{% extends "base.html" %}

{% block title %}Admin - Projects - Test Service{% endblock %}

{% block content %}
<h2 class="mb-4">Project Management</h2>

<nav class="nav nav-pills mb-4">
    <a class="nav-link" href="/admin">Dashboard</a>
    <a class="nav-link" href="/admin/users">Users</a>
    <a class="nav-link active" href="/admin/projects">Projects</a>
    <a class="nav-link" href="/admin/tasks">Tasks</a>
    <a class="nav-link" href="/admin/ip-logs">IP Logs</a>
    <a class="nav-link" href="/admin/settings">Settings</a>
</nav>

<div id="projectsList">
    <!-- Projects will be loaded here -->
</div>

<script>
async function loadProjects() {
    const token = localStorage.getItem('token');
    if (!token) {
        window.location.href = '/login';
        return;
    }
    
    try {
        const response = await fetch('/api/projects/?limit=50', {
            headers: {
                'Authorization': `Bearer ${token}`
            }
        });
        
        if (response.ok) {
            const projects = await response.json();
            displayProjects(projects);
        } else {
            showAlert('Failed to load projects', 'danger');
        }
    } catch (error) {
        showAlert('An error occurred', 'danger');
    }
}

function displayProjects(projects) {
    const container = document.getElementById('projectsList');
    
    if (projects.length === 0) {
        container.innerHTML = '<p class="text-center">No projects found</p>';
        return;
    }
    
    container.innerHTML = `
        <div class="table-responsive">
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Creator ID</th>
                        <th>Status</th>
                        <th>Created</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    ${projects.map(project => `
                        <tr>
                            <td>${project.id}</td>
                            <td>${escapeHtml(project.name)}</td>
                            <td>${project.creator_id}</td>
                            <td><span class="badge bg-${getStatusBadgeClass(project.status)}">${project.status}</span></td>
                            <td>${new Date(project.created_at).toLocaleDateString()}</td>
                            <td>
                                <a href="/projects/${project.id}" class="btn btn-sm btn-primary">View</a>
                            </td>
                        </tr>
                    `).join('')}
                </tbody>
            </table>
        </div>
    `;
}

function getStatusBadgeClass(status) {
    const classes = {
        'active': 'success',
        'completed': 'primary',
        'archived': 'secondary'
    };
    return classes[status] || 'secondary';
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

document.addEventListener('DOMContentLoaded', loadProjects);
</script>
{% endblock %}
