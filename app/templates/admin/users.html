{% extends "base.html" %}

{% block title %}Admin - Users - Test Service{% endblock %}

{% block content %}
<h2 class="mb-4">User Management</h2>

<nav class="nav nav-pills mb-4">
    <a class="nav-link" href="/admin">Dashboard</a>
    <a class="nav-link active" href="/admin/users">Users</a>
    <a class="nav-link" href="/admin/projects">Projects</a>
    <a class="nav-link" href="/admin/tasks">Tasks</a>
    <a class="nav-link" href="/admin/ip-logs">IP Logs</a>
    <a class="nav-link" href="/admin/settings">Settings</a>
</nav>

<div class="mb-3">
    <select class="form-select" id="roleFilter" onchange="loadUsers()">
        <option value="">All Roles</option>
        <option value="creator">Creators</option>
        <option value="tester">Testers</option>
        <option value="admin">Admins</option>
    </select>
</div>

<div class="table-responsive">
    <table class="table table-striped">
        <thead>
            <tr>
                <th>ID</th>
                <th>Username</th>
                <th>Email</th>
                <th>Role</th>
                <th>Status</th>
                <th>Created</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="usersTable">
            <!-- Users will be loaded here -->
        </tbody>
    </table>
</div>

<script>
async function loadUsers() {
    const token = localStorage.getItem('token');
    if (!token) {
        window.location.href = '/login';
        return;
    }
    
    const role = document.getElementById('roleFilter').value;
    let url = '/api/admin/users?limit=50';
    if (role) url += `&role=${role}`;
    
    try {
        const response = await fetch(url, {
            headers: {
                'Authorization': `Bearer ${token}`
            }
        });
        
        if (response.ok) {
            const users = await response.json();
            displayUsers(users);
        } else {
            showAlert('Failed to load users', 'danger');
        }
    } catch (error) {
        showAlert('An error occurred', 'danger');
    }
}

function displayUsers(users) {
    const tbody = document.getElementById('usersTable');
    
    if (users.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" class="text-center">No users found</td></tr>';
        return;
    }
    
    tbody.innerHTML = users.map(user => `
        <tr>
            <td>${user.id}</td>
            <td>${escapeHtml(user.username)}</td>
            <td>${escapeHtml(user.email)}</td>
            <td><span class="badge bg-primary">${user.role}</span></td>
            <td><span class="badge bg-${user.is_active ? 'success' : 'danger'}">${user.is_active ? 'Active' : 'Inactive'}</span></td>
            <td>${new Date(user.created_at).toLocaleDateString()}</td>
            <td>
                ${user.is_active 
                    ? `<button class="btn btn-sm btn-warning" onclick="deactivateUser(${user.id})">Deactivate</button>`
                    : `<button class="btn btn-sm btn-success" onclick="activateUser(${user.id})">Activate</button>`
                }
            </td>
        </tr>
    `).join('');
}

async function activateUser(userId) {
    const token = localStorage.getItem('token');
    
    try {
        const response = await fetch(`/api/admin/users/${userId}/activate`, {
            method: 'PUT',
            headers: {
                'Authorization': `Bearer ${token}`
            }
        });
        
        if (response.ok) {
            showAlert('User activated successfully', 'success');
            loadUsers();
        } else {
            const data = await response.json();
            showAlert(data.detail || 'Failed to activate user', 'danger');
        }
    } catch (error) {
        showAlert('An error occurred', 'danger');
    }
}

async function deactivateUser(userId) {
    const token = localStorage.getItem('token');
    
    try {
        const response = await fetch(`/api/admin/users/${userId}/deactivate`, {
            method: 'PUT',
            headers: {
                'Authorization': `Bearer ${token}`
            }
        });
        
        if (response.ok) {
            showAlert('User deactivated successfully', 'success');
            loadUsers();
        } else {
            const data = await response.json();
            showAlert(data.detail || 'Failed to deactivate user', 'danger');
        }
    } catch (error) {
        showAlert('An error occurred', 'danger');
    }
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

document.addEventListener('DOMContentLoaded', loadUsers);
</script>
{% endblock %}
