{% extends "base.html" %}

{% block title %}Messages - Test Service{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-8 mx-auto">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Messages</h2>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#newMessageModal">
                <i class="bi bi-envelope"></i> New Message
            </button>
        </div>
        
        <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" id="unreadOnly" onchange="loadMessages()">
            <label class="form-check-label" for="unreadOnly">
                Show unread only
            </label>
        </div>
        
        <div id="messagesList">
            <!-- Messages will be loaded here -->
        </div>
    </div>
</div>

<!-- New Message Modal -->
<div class="modal fade" id="newMessageModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">New Message</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="newMessageForm">
                    <div class="mb-3">
                        <label for="receiverId" class="form-label">Receiver ID (optional)</label>
                        <input type="number" class="form-control" id="receiverId">
                    </div>
                    <div class="mb-3">
                        <label for="projectId" class="form-label">Project ID (optional)</label>
                        <input type="number" class="form-control" id="projectId">
                    </div>
                    <div class="mb-3">
                        <label for="subject" class="form-label">Subject</label>
                        <input type="text" class="form-control" id="subject">
                    </div>
                    <div class="mb-3">
                        <label for="content" class="form-label">Message</label>
                        <textarea class="form-control" id="content" rows="4" required></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>
</div>

<script>
async function loadMessages() {
    const token = localStorage.getItem('token');
    if (!token) {
        window.location.href = '/login';
        return;
    }
    
    const unreadOnly = document.getElementById('unreadOnly').checked;
    const url = `/api/messages/?limit=20${unreadOnly ? '&unread_only=true' : ''}`;
    
    try {
        const response = await fetch(url, {
            headers: {
                'Authorization': `Bearer ${token}`
            }
        });
        
        if (response.ok) {
            const messages = await response.json();
            displayMessages(messages);
        } else {
            showAlert('Failed to load messages', 'danger');
        }
    } catch (error) {
        showAlert('An error occurred', 'danger');
    }
}

function displayMessages(messages) {
    const container = document.getElementById('messagesList');
    
    if (messages.length === 0) {
        container.innerHTML = '<p class="text-center">No messages found.</p>';
        return;
    }
    
    container.innerHTML = messages.map(message => `
        <div class="card mb-2 ${message.is_read ? '' : 'border-primary'}">
            <div class="card-body">
                <div class="d-flex justify-content-between">
                    <h6>${escapeHtml(message.subject || 'No subject')}</h6>
                    ${!message.is_read ? '<span class="badge bg-primary">New</span>' : ''}
                </div>
                <p class="card-text">${escapeHtml(message.content)}</p>
                <small class="text-muted">From User #${message.sender_id} - ${new Date(message.created_at).toLocaleString()}</small>
            </div>
        </div>
    `).join('');
}

async function sendMessage() {
    const token = localStorage.getItem('token');
    const receiverId = document.getElementById('receiverId').value;
    const projectId = document.getElementById('projectId').value;
    const subject = document.getElementById('subject').value;
    const content = document.getElementById('content').value;
    
    try {
        const body = {
            content,
            subject: subject || null,
            receiver_id: receiverId ? parseInt(receiverId) : null,
            project_id: projectId ? parseInt(projectId) : null
        };
        
        const response = await fetch('/api/messages/', {
            method: 'POST',
            headers: {
                'Authorization': `Bearer ${token}`,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(body)
        });
        
        if (response.ok) {
            showAlert('Message sent successfully', 'success');
            bootstrap.Modal.getInstance(document.getElementById('newMessageModal')).hide();
            document.getElementById('newMessageForm').reset();
            loadMessages();
        } else {
            const data = await response.json();
            showAlert(data.detail || 'Failed to send message', 'danger');
        }
    } catch (error) {
        showAlert('An error occurred', 'danger');
    }
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

document.addEventListener('DOMContentLoaded', loadMessages);
</script>
{% endblock %}
