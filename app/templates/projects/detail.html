{% extends "base.html" %}

{% block title %}Project Details - Test Service{% endblock %}

{% block content %}
<div id="projectDetails">
    <!-- Project details will be loaded here -->
</div>

<div class="row mt-4">
    <div class="col-md-8">
        <h3>Tasks</h3>
        <button class="btn btn-sm btn-primary mb-3" data-bs-toggle="modal" data-bs-target="#createTaskModal" id="createTaskBtn">
            <i class="bi bi-plus-circle"></i> Create Task
        </button>
        <div id="tasksList">
            <!-- Tasks will be loaded here -->
        </div>
    </div>
    <div class="col-md-4">
        <h3>Project Members</h3>
        <div id="membersList">
            <!-- Members will be loaded here -->
        </div>
        <button class="btn btn-success mt-3" onclick="joinProject()" id="joinProjectBtn">
            <i class="bi bi-person-plus"></i> Join Project
        </button>
    </div>
</div>

<!-- Create Task Modal -->
<div class="modal fade" id="createTaskModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Create New Task</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="createTaskForm">
                    <div class="mb-3">
                        <label for="taskTitle" class="form-label">Task Title</label>
                        <input type="text" class="form-control" id="taskTitle" required>
                    </div>
                    <div class="mb-3">
                        <label for="taskDescription" class="form-label">Description</label>
                        <textarea class="form-control" id="taskDescription" rows="3"></textarea>
                    </div>
                    <div class="mb-3">
                        <label for="taskPriority" class="form-label">Priority</label>
                        <select class="form-select" id="taskPriority">
                            <option value="1">Low</option>
                            <option value="2">Medium</option>
                            <option value="3">High</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="taskDueDate" class="form-label">Due Date</label>
                        <input type="datetime-local" class="form-control" id="taskDueDate">
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" onclick="createTask()">Create</button>
            </div>
        </div>
    </div>
</div>

<script>
const projectId = {{ project_id }};
let currentUser = null;
let project = null;

async function loadProjectDetails() {
    const token = localStorage.getItem('token');
    if (!token) {
        window.location.href = '/login';
        return;
    }
    
    try {
        const response = await fetch(`/api/projects/${projectId}`, {
            headers: {
                'Authorization': `Bearer ${token}`
            }
        });
        
        if (response.ok) {
            project = await response.json();
            displayProjectDetails(project);
            loadTasks();
        } else {
            showAlert('Failed to load project', 'danger');
        }
    } catch (error) {
        showAlert('An error occurred', 'danger');
    }
}

function displayProjectDetails(project) {
    const container = document.getElementById('projectDetails');
    container.innerHTML = `
        <div class="card">
            <div class="card-body">
                <h2>${escapeHtml(project.name)}</h2>
                <p class="lead">${escapeHtml(project.description || 'No description')}</p>
                <span class="badge bg-${getStatusBadgeClass(project.status)}">${project.status}</span>
                <p class="mt-3"><small class="text-muted">Created: ${new Date(project.created_at).toLocaleString()}</small></p>
            </div>
        </div>
    `;
    
    // Show/hide create task button
    if (currentUser && (currentUser.id === project.creator_id || currentUser.is_admin)) {
        document.getElementById('createTaskBtn').style.display = 'inline-block';
    } else {
        document.getElementById('createTaskBtn').style.display = 'none';
    }
}

async function loadTasks() {
    const token = localStorage.getItem('token');
    
    try {
        const response = await fetch(`/api/tasks/?project_id=${projectId}&limit=50`, {
            headers: {
                'Authorization': `Bearer ${token}`
            }
        });
        
        if (response.ok) {
            const tasks = await response.json();
            displayTasks(tasks);
        }
    } catch (error) {
        console.error('Failed to load tasks', error);
    }
}

function displayTasks(tasks) {
    const container = document.getElementById('tasksList');
    
    if (tasks.length === 0) {
        container.innerHTML = '<p class="text-muted">No tasks yet.</p>';
        return;
    }
    
    container.innerHTML = tasks.map(task => `
        <div class="card mb-2">
            <div class="card-body">
                <h5>${escapeHtml(task.title)}</h5>
                <p class="card-text">${escapeHtml(task.description || '')}</p>
                <span class="badge bg-${getTaskStatusBadgeClass(task.status)}">${task.status}</span>
                <span class="badge bg-info">Priority: ${task.priority}</span>
            </div>
        </div>
    `).join('');
}

async function createTask() {
    const token = localStorage.getItem('token');
    const title = document.getElementById('taskTitle').value;
    const description = document.getElementById('taskDescription').value;
    const priority = parseInt(document.getElementById('taskPriority').value);
    const dueDate = document.getElementById('taskDueDate').value;
    
    try {
        const response = await fetch('/api/tasks/', {
            method: 'POST',
            headers: {
                'Authorization': `Bearer ${token}`,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                project_id: projectId,
                title,
                description,
                priority,
                due_date: dueDate || null
            })
        });
        
        if (response.ok) {
            showAlert('Task created successfully', 'success');
            bootstrap.Modal.getInstance(document.getElementById('createTaskModal')).hide();
            document.getElementById('createTaskForm').reset();
            loadTasks();
        } else {
            const data = await response.json();
            showAlert(data.detail || 'Failed to create task', 'danger');
        }
    } catch (error) {
        showAlert('An error occurred', 'danger');
    }
}

async function joinProject() {
    const token = localStorage.getItem('token');
    
    try {
        const response = await fetch(`/api/projects/${projectId}/join`, {
            method: 'POST',
            headers: {
                'Authorization': `Bearer ${token}`
            }
        });
        
        if (response.ok) {
            showAlert('Successfully joined project', 'success');
            document.getElementById('joinProjectBtn').disabled = true;
        } else {
            const data = await response.json();
            showAlert(data.detail || 'Failed to join project', 'danger');
        }
    } catch (error) {
        showAlert('An error occurred', 'danger');
    }
}

async function loadCurrentUser() {
    const token = localStorage.getItem('token');
    if (!token) return;
    
    try {
        const response = await fetch('/api/users/me', {
            headers: {
                'Authorization': `Bearer ${token}`
            }
        });
        
        if (response.ok) {
            currentUser = await response.json();
        }
    } catch (error) {
        console.error('Failed to load user', error);
    }
}

function getStatusBadgeClass(status) {
    const classes = {
        'active': 'success',
        'completed': 'primary',
        'archived': 'secondary'
    };
    return classes[status] || 'secondary';
}

function getTaskStatusBadgeClass(status) {
    const classes = {
        'open': 'warning',
        'in_progress': 'info',
        'completed': 'success',
        'closed': 'secondary'
    };
    return classes[status] || 'secondary';
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

document.addEventListener('DOMContentLoaded', async () => {
    await loadCurrentUser();
    loadProjectDetails();
});
</script>
{% endblock %}
