{% extends "base.html" %}

{% block title %}Projects - Test Service{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Projects</h2>
    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#createProjectModal" id="createProjectBtn">
        <i class="bi bi-plus-circle"></i> Create Project
    </button>
</div>

<!-- Search and Filter -->
<div class="card mb-4">
    <div class="card-body">
        <div class="row">
            <div class="col-md-6">
                <input type="text" class="form-control" id="searchInput" placeholder="Search projects...">
            </div>
            <div class="col-md-3">
                <select class="form-select" id="statusFilter">
                    <option value="">All Statuses</option>
                    <option value="active">Active</option>
                    <option value="completed">Completed</option>
                    <option value="archived">Archived</option>
                </select>
            </div>
            <div class="col-md-3">
                <button class="btn btn-secondary w-100" onclick="loadProjects()">
                    <i class="bi bi-search"></i> Search
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Projects List -->
<div id="projectsList" class="row">
    <!-- Projects will be loaded here -->
</div>

<!-- Create Project Modal -->
<div class="modal fade" id="createProjectModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Create New Project</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="createProjectForm">
                    <div class="mb-3">
                        <label for="projectName" class="form-label">Project Name</label>
                        <input type="text" class="form-control" id="projectName" required>
                    </div>
                    <div class="mb-3">
                        <label for="projectDescription" class="form-label">Description</label>
                        <textarea class="form-control" id="projectDescription" rows="3"></textarea>
                    </div>
                    <div class="mb-3">
                        <label for="projectStatus" class="form-label">Status</label>
                        <select class="form-select" id="projectStatus">
                            <option value="active">Active</option>
                            <option value="completed">Completed</option>
                            <option value="archived">Archived</option>
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" onclick="createProject()">Create</button>
            </div>
        </div>
    </div>
</div>

<script>
let currentUser = null;

async function loadProjects() {
    const token = localStorage.getItem('token');
    if (!token) {
        window.location.href = '/login';
        return;
    }
    
    const search = document.getElementById('searchInput').value;
    const status = document.getElementById('statusFilter').value;
    
    let url = '/api/projects/?limit=20';
    if (search) url += `&search=${encodeURIComponent(search)}`;
    if (status) url += `&status=${status}`;
    
    try {
        const response = await fetch(url, {
            headers: {
                'Authorization': `Bearer ${token}`
            }
        });
        
        if (response.ok) {
            const projects = await response.json();
            displayProjects(projects);
        } else {
            showAlert('Failed to load projects', 'danger');
        }
    } catch (error) {
        showAlert('An error occurred', 'danger');
    }
}

function displayProjects(projects) {
    const container = document.getElementById('projectsList');
    
    if (projects.length === 0) {
        container.innerHTML = '<div class="col-12"><p class="text-center">No projects found.</p></div>';
        return;
    }
    
    container.innerHTML = projects.map(project => `
        <div class="col-md-6 col-lg-4 mb-3">
            <div class="card h-100">
                <div class="card-body">
                    <h5 class="card-title">${escapeHtml(project.name)}</h5>
                    <p class="card-text">${escapeHtml(project.description || 'No description')}</p>
                    <span class="badge bg-${getStatusBadgeClass(project.status)}">${project.status}</span>
                </div>
                <div class="card-footer">
                    <a href="/projects/${project.id}" class="btn btn-sm btn-primary">View Details</a>
                </div>
            </div>
        </div>
    `).join('');
}

async function createProject() {
    const token = localStorage.getItem('token');
    const name = document.getElementById('projectName').value;
    const description = document.getElementById('projectDescription').value;
    const status = document.getElementById('projectStatus').value;
    
    try {
        const response = await fetch('/api/projects/', {
            method: 'POST',
            headers: {
                'Authorization': `Bearer ${token}`,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ name, description, status })
        });
        
        if (response.ok) {
            showAlert('Project created successfully', 'success');
            bootstrap.Modal.getInstance(document.getElementById('createProjectModal')).hide();
            document.getElementById('createProjectForm').reset();
            loadProjects();
        } else {
            const data = await response.json();
            showAlert(data.detail || 'Failed to create project', 'danger');
        }
    } catch (error) {
        showAlert('An error occurred', 'danger');
    }
}

async function loadCurrentUser() {
    const token = localStorage.getItem('token');
    if (!token) return;
    
    try {
        const response = await fetch('/api/users/me', {
            headers: {
                'Authorization': `Bearer ${token}`
            }
        });
        
        if (response.ok) {
            currentUser = await response.json();
            // Show create button only for creators
            if (currentUser.role !== 'creator') {
                document.getElementById('createProjectBtn').style.display = 'none';
            }
        }
    } catch (error) {
        console.error('Failed to load user', error);
    }
}

function getStatusBadgeClass(status) {
    const classes = {
        'active': 'success',
        'completed': 'primary',
        'archived': 'secondary'
    };
    return classes[status] || 'secondary';
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

// Load on page load
document.addEventListener('DOMContentLoaded', () => {
    loadCurrentUser();
    loadProjects();
});
</script>
{% endblock %}
